; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = .
test_dir = test/test_core
default_envs = release

[env:release]
platform = ststm32
upload_protocol = stlink
debug_tool = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200

board = nucleo_c031c6
board_build.ldscript = STM32C031XX_FLASH.ld

build_flags =
    -std=gnu23
    -Os
    -flto
    -Wl,--gc-sections
    -ffunction-sections
    -fdata-sections
    -D_XOPEN_SOURCE
    -DUSE_HAL_DRIVER
    -ICore/Inc
    -ICore/Inc/recruiting
    -ICore/Inc/recruiting/module_name
    -ICore/Inc/recruiting/temperature
    -IDrivers/CMSIS/Include/
    -IDrivers/STM32C0xx_HAL_Driver/Inc/
    -IDrivers/STM32C0xx_HAL_Driver/Inc/Legacy/
    -IDrivers/CMSIS/Device/ST/STM32C0xx/Include/
    --specs=nano.specs
    --specs=nosys.specs

build_src_filter =
    +<Core/Src/>
    +<Drivers/STM32C0xx_HAL_Driver/Src/>
    -<Drivers/STM32C0xx_HAL_Driver/Src/*_template.c>
    +<./startup_stm32c031xx.s>

lib_deps =
    https://github.com/eagletrt/libtimebase-sw
    https://github.com/eagletrt/libfsm-sw

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
    clangtidy: --extra-arg=-std=gnu23
    clangtidy: --extra-arg=-U__cplusplus
check_src_filters =
    -<**>
    +<Core/Src/recruiting>
    +<Core/Inc/recruiting>
    ; Add here the directories you want to check with clang-tidy

monitor_filters = direct

[env:tests]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu23
    -DEAGLETRT_STATIC=
    -lm ;link math.h
    -D_XOPEN_SOURCE
    -ICore/Inc/recruiting/filters
    -ICore/Inc/recruiting/fsm
    -ICore/Inc/recruiting/bsp
    -ICore/Test/include

build_src_filter =
    +<Core/Src/recruiting/filters/>
    +<Core/Src/recruiting/serial-task/>
    +<Core/Src/recruiting/sensor-task/>
    +<Core/Src/recruiting/control-task/>
    +<Core/Src/recruiting/bsp/>
    +<Core/Src/recruiting/shared-data/>
    +<Core/Src/recruiting/app-tasks/>


lib_deps =
    https://github.com/eagletrt/libtimebase-sw
    https://github.com/eagletrt/libfsm-sw

[env:debug]
   extends = env:release
   build_type = debug